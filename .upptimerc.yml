# Upptime — мониторинг доступности Content Box (тенант Coco Jambo).
#
# Как это работает: раз в 5 минут GitHub Actions в ЭТОМ репозитории пингует
# перечисленные ниже адреса, пишет историю ответов и графики прямо в репозиторий,
# а при падении заводит issue (и закрывает, когда сайт снова отвечает). Статус-
# страница — статический сайт на GitHub Pages, поэтому она живёт ОТДЕЛЬНО от
# приложения: если упадёт сам сайт или сервер Timeweb, страница со статусом
# останется доступной (в этом весь смысл — как Atlassian Statuspage).
#
# Репозиторий создаётся из шаблона upptime/upptime; сюда кладётся только этот
# файл. Инструкция по установке — в upptime-setup-ru.md.

# Владелец и имя ЭТОГО репозитория со статус-страницей (НЕ content-box).
# Если назовёшь репозиторий иначе — поправь repo здесь.
owner: dvasincom-sketch
repo: content-box-status

# Что мониторим. Два уровня намеренно:
#   1. Фронт — «сайт открывается вообще» (Next отдаёт главную).
#   2. /api/health — «приложение живо И видит базу»: эндпоинт делает SELECT 1 и
#      отдаёт 200 только при доступном Postgres, иначе 503. Поэтому здесь ловится
#      случай «сайт открывается, но база отвалилась» — глубокая проверка.
sites:
  - name: Сайт Coco Jambo
    url: https://btsrussia.ru/
    # Строго 200: главная не должна редиректить. Если увидим 3xx/5xx — инцидент.
    expectedStatusCodes:
      - 200

  - name: Приложение и база (health)
    url: https://btsrussia.ru/api/health
    # 200 = приложение отвечает и достучалось до Postgres. 503 (база недоступна)
    # автоматически считается падением — отдельного правила не нужно.
    expectedStatusCodes:
      - 200

# Кого назначать на issue о падении. Впиши свой GitHub-логин, если он другой.
assignees:
  - dvasincom-sketch

status-website:
  name: Content Box — статус
  # Если поднимешь поддомен status.btsrussia.ru — раскомментируй и укажи его,
  # затем добавь CNAME-запись у DNS-провайдера (см. инструкцию). Без CNAME
  # страница просто откроется по адресу вида dvasincom-sketch.github.io/content-box-status.
  # cname: status.btsrussia.ru
  introTitle: '**Content Box** — статус сервисов'
  introMessage: >-
    Актуальная доступность сайта Coco Jambo и его API. Данные обновляются
    автоматически каждые 5 минут. Страница размещена отдельно от приложения,
    поэтому остаётся доступной даже во время сбоя на сайте.
  navbar:
    - title: Статус
      href: /
    - title: GitHub
      href: https://github.com/dvasincom-sketch/content-box-status

